# 全栈自托管部署：一台 VPS 跑完全部进程。步骤见 DEPLOY.md「方案 B」。
#
#   cp deploy/stack.env.example  deploy/stack.env
#   cp deploy/web.env.example    deploy/web.env
#   cp deploy/python.env.example deploy/python.env
#   # 三份文件都填好之后：
#   docker compose -f docker-compose.prod.yml --env-file deploy/stack.env up -d --build
#
# 本文件不用于本地开发；本地开发仍用 docker-compose.yml（只起 Postgres）。
#
# 网络安全要点：python 服务只用 expose，不做端口映射，因此公网完全访问不到
# /ingest、/tools/invoke、/traces。只有同一 Compose 网络里的 web 能调它。
# 这也是本方案不需要 INTERNAL_TOKEN 的原因。

name: cited-rag

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cited}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/stack.env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cited_rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-cited} -d ${POSTGRES_DB:-cited_rag}
      interval: 5s
      timeout: 5s
      retries: 20

  # 一次性任务：跑 drizzle 迁移，跑完即退出，web 等它成功后才启动
  migrate:
    build:
      context: .
      target: builder
    command: ["pnpm", "db:migrate"]
    env_file:
      - deploy/web.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  python:
    build:
      context: python
    restart: unless-stopped
    env_file:
      - deploy/python.env
    volumes:
      - pyindex:/srv/indexes
      - pyuploads:/srv/data/uploads
      - pytraces:/srv/traces
      - pydemo:/srv/data/demo
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - deploy/web.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      python:
        condition: service_started
    expose:
      - "3000"

  # HTTPS 由 Caddy 自动申请并续期证书，只要 SITE_DOMAIN 已解析到本机
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在 deploy/stack.env 里设置 SITE_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
  pyindex:
  pyuploads:
  pytraces:
  pydemo:
  caddydata:
  caddyconfig:
